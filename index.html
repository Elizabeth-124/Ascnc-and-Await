<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Developer Lookup | Async/Await</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>
<body class="bg-light py-5">

    <div class="container" style="max-width: 580px;">
        <div class="card shadow-sm border-0 rounded-4 p-4">
            
            <h2 class="h4 fw-bold text-dark mb-1">GitHub Profile Search</h2>
            <p class="text-muted small mb-4">Query live developer data asynchronously using <code>async/await</code>.</p>

            <!-- Search Form -->
            <form id="searchForm" class="d-flex gap-2 mb-3">
                <input type="text" class="form-control" id="usernameInput" placeholder="Enter GitHub username (e.g., torvalds)" required>
                <button type="submit" class="btn btn-primary d-flex align-items-center gap-1 text-nowrap" id="searchBtn">
                    <i class="bi bi-search"></i>
                    <span>Search</span>
                </button>
            </form>

            <!-- Loading State -->
            <div id="loadingIndicator" class="text-center py-4 d-none">
                <div class="spinner-border text-primary spinner-border-sm" role="status"></div>
                <span class="text-muted small ms-2">Reaching out to GitHub API...</span>
            </div>

            <!-- Error Banner -->
            <div id="errorAlert" class="alert alert-danger d-none small py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-1"></i>
                <span id="errorMessage">User not found.</span>
            </div>

            <!-- Profile Output Card -->
            <div id="profileContainer" class="d-none mt-3 p-3 bg-white border rounded-3">
                <div class="d-flex align-items-center gap-3">
                    <img id="avatarImg" src="" alt="Avatar" class="rounded-circle border" width="70" height="70">
                    <div class="flex-grow-1">
                        <h3 class="h5 fw-bold text-dark mb-0" id="profileName">Full Name</h3>
                        <p class="text-muted small mb-1" id="profileBio">Bio goes here...</p>
                        <span class="badge bg-secondary-subtle text-secondary small" id="profileHandle">@handle</span>

                        <p class="text-muted small mb-1" id="profileLocation"></p>
                        <p class="text-muted small mb-1" id="profileCompany"></p>
                    </div>
                </div>

                <hr class="my-3">

                <div class="row text-center g-2">
                    <div class="col-4">
                        <div class="p-2 bg-light rounded">
                            <span class="d-block small text-muted">Public Repos</span>
                            <strong class="text-dark" id="repoCount">0</strong>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2 bg-light rounded">
                            <span class="d-block small text-muted">Followers</span>
                            <strong class="text-dark" id="followerCount">0</strong>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="p-2 bg-light rounded">
                            <span class="d-block small text-muted">Following</span>
                            <strong class="text-dark" id="followingCount">0</strong>
                        </div>
                    </div>
                </div>

                <div class="mt-3 text-end">
                    <a href="#" target="_blank" id="profileLink" class="btn btn-sm btn-outline-primary">
                        View GitHub Profile &rarr;
                    </a>
                </div>
            </div>

        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
